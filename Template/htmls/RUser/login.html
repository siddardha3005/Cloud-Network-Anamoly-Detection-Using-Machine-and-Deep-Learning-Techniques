<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud Network Anomaly Detection</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #FF6B35;
            --primary-teal: #17A2B8;
            --accent-red: #DC3545;
            --dark-gray: #2C3E50;
            --light-gray: #ECF0F1;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #DC3545 50%, #17A2B8 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 2rem auto;
            padding: 3rem;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        
        .hero-title {
            background: linear-gradient(45deg, var(--primary-orange), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 2rem;
            display: block;
            border: 5px solid var(--primary-orange);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }
        
        .form-floating {
            margin-bottom: 1.5rem;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 0.2rem rgba(23, 162, 184, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(45deg, var(--primary-orange), var(--accent-red));
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            width: 100%;
            font-size: 1.1rem;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
            color: white;
        }
        
        .register-link {
            background: rgba(255, 107, 53, 0.1);
            border: 2px solid var(--primary-orange);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 2rem;
        }
        
        .register-link a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .register-link a:hover {
            color: var(--accent-red);
        }
        
        .navbar-custom {
            background: linear-gradient(90deg, var(--primary-orange) 0%, var(--accent-red) 100%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 1rem 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white !important;
        }
        
        .nav-link {
            color: white !important;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 0 5px;
        }
        
        .nav-link:hover {
            background-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .alert-custom {
            background: linear-gradient(45deg, var(--primary-teal), #138496);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 15px;
            margin-bottom: 2rem;
        }
        
        .input-group-text {
            background: var(--primary-teal);
            color: white;
            border: 2px solid var(--primary-teal);
            border-right: none;
        }
        
        .input-group .form-control {
            border-left: none;
        }
        
        .input-group .form-control:focus {
            border-left: 2px solid var(--primary-teal);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                <i class="fas fa-shield-alt me-2"></i>
                Cloud Network Security
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'login' %}">
                            <i class="fas fa-user me-1"></i>Remote User
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'serviceproviderlogin' %}">
                            <i class="fas fa-cogs me-1"></i>Service Provider
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container">
        <div class="login-container">
            <h1 class="hero-title">
                <i class="fas fa-sign-in-alt me-2"></i>
                User Login
            </h1>
            
            <div class="alert alert-custom text-center">
                <i class="fas fa-info-circle me-2"></i>
                Access your secure dashboard to predict network anomalies
            </div>
            
            <img src="{% static '/login.jpg' %}" alt="Login" class="login-image">
            
            <form method="POST" role="form">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">
                        <i class="fas fa-user me-2"></i>Username
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" id="username" class="form-control" 
                               placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">
                        <i class="fas fa-lock me-2"></i>Password
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control" 
                               placeholder="Enter your password" required>
                    </div>
                </div>
                
                <button type="submit" name="submit1" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Login to Dashboard
                </button>
            </form>
            
            <div class="register-link">
                <i class="fas fa-user-plus me-2"></i>
                <strong>New User?</strong>
                <a href="{% url 'Register1' %}">Create your account here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
