<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC3545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17A2B8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="networkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Network nodes and connections -->
  <g id="network" stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF" opacity="0.8">
    <!-- Central hub -->
    <circle cx="400" cy="200" r="15" fill="#FFFFFF" filter="url(#glow)"/>
    
    <!-- Outer nodes -->
    <circle cx="200" cy="100" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="600" cy="100" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="150" cy="250" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="650" cy="250" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="300" cy="320" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="500" cy="320" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Connections -->
    <line x1="400" y1="200" x2="200" y2="100" opacity="0.6"/>
    <line x1="400" y1="200" x2="600" y2="100" opacity="0.6"/>
    <line x1="400" y1="200" x2="150" y2="250" opacity="0.6"/>
    <line x1="400" y1="200" x2="650" y2="250" opacity="0.6"/>
    <line x1="400" y1="200" x2="300" y2="320" opacity="0.6"/>
    <line x1="400" y1="200" x2="500" y2="320" opacity="0.6"/>
    
    <!-- Secondary connections -->
    <line x1="200" y1="100" x2="150" y2="250" opacity="0.4"/>
    <line x1="600" y1="100" x2="650" y2="250" opacity="0.4"/>
    <line x1="300" y1="320" x2="500" y2="320" opacity="0.4"/>
  </g>
  
  <!-- Shield icon -->
  <g transform="translate(50, 150)" filter="url(#glow)">
    <path d="M40 0 L80 20 L80 60 C80 80 60 100 40 120 C20 100 0 80 0 60 L0 20 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M40 20 L65 32 L65 58 C65 70 52 82 40 92 C28 82 15 70 15 58 L15 32 Z" 
          fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Circuit patterns -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.4">
    <rect x="600" y="50" width="40" height="4" rx="2"/>
    <rect x="650" y="50" width="40" height="4" rx="2"/>
    <rect x="700" y="50" width="40" height="4" rx="2"/>
    <rect x="600" y="60" width="140" height="4" rx="2"/>
    <rect x="600" y="70" width="140" height="4" rx="2"/>
  </g>
  
  <!-- Data packets -->
  <g fill="#FFFFFF" opacity="0.7">
    <rect x="250" y="150" width="12" height="8" rx="2"/>
    <rect x="270" y="170" width="12" height="8" rx="2"/>
    <rect x="290" y="190" width="12" height="8" rx="2"/>
    <rect x="520" y="180" width="12" height="8" rx="2"/>
    <rect x="540" y="200" width="12" height="8" rx="2"/>
    <rect x="560" y="220" width="12" height="8" rx="2"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="#FFFFFF" opacity="0.95">
    Cloud Network Security
  </text>
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="14" 
        text-anchor="middle" fill="#FFFFFF" opacity="0.8">
    Advanced Anomaly Detection
  </text>
</svg>