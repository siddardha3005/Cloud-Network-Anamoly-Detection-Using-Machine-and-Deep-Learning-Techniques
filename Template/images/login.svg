<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loginGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC3545;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="75" cy="75" r="70" fill="url(#loginGradient)" filter="url(#shadow)"/>
  
  <!-- Inner glow -->
  <circle cx="75" cy="75" r="65" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- Lock body -->
  <rect x="50" y="60" width="50" height="40" rx="8" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Lock shackle -->
  <path d="M 60 60 C 60 45, 90 45, 90 60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Keyhole -->
  <circle cx="75" cy="75" r="6" fill="#FF6B35"/>
  <rect x="72" y="81" width="6" height="12" rx="2" fill="#FF6B35"/>
  
  <!-- Security dots -->
  <circle cx="40" cy="40" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="110" cy="40" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="40" cy="110" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="110" cy="110" r="3" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Circuit lines -->
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.4">
    <line x1="30" y1="50" x2="45" y2="55"/>
    <line x1="30" y1="50" x2="45" y2="45"/>
    <line x1="105" y1="55" x2="120" y2="50"/>
    <line x1="105" y1="45" x2="120" y2="50"/>
    <line x1="30" y1="100" x2="45" y2="95"/>
    <line x1="105" y1="95" x2="120" y2="100"/>
  </g>
  
  <!-- Data packets -->
  <rect x="25" y="65" width="8" height="4" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="117" y="80" width="8" height="4" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="30" y="85" width="6" height="3" rx="1" fill="#FFFFFF" opacity="0.5"/>
  <rect x="114" y="70" width="6" height="3" rx="1" fill="#FFFFFF" opacity="0.5"/>
</svg>