<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="registerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC3545;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="75" cy="75" r="70" fill="url(#registerGradient)" filter="url(#shadow)"/>
  
  <!-- Inner glow -->
  <circle cx="75" cy="75" r="65" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- User silhouette -->
  <circle cx="75" cy="55" r="18" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="75" cy="100" rx="22" ry="28" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Add/Plus icon overlay -->
  <g transform="translate(105, 105)">
    <circle cx="0" cy="0" r="16" fill="#17A2B8" opacity="0.9"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Shield accent -->
  <g transform="translate(35, 35)">
    <path d="M8 0 L16 4 L16 12 C16 16 12 20 8 24 C4 20 0 16 0 12 L0 4 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Circuit patterns -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.4">
    <rect x="25" y="25" width="20" height="3" rx="1"/>
    <rect x="105" y="25" width="20" height="3" rx="1"/>
    <rect x="25" y="122" width="20" height="3" rx="1"/>
    <rect x="105" y="122" width="20" height="3" rx="1"/>
  </g>
  
  <!-- Connection dots -->
  <circle cx="30" cy="30" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="120" cy="30" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="30" cy="120" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="120" cy="120" r="2" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Network nodes around user -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="45" cy="35" r="2"/>
    <circle cx="105" cy="35" r="2"/>
    <circle cx="35" cy="45" r="2"/>
    <circle cx="115" cy="45" r="2"/>
    <circle cx="35" cy="105" r="2"/>
    <circle cx="115" cy="105" r="2"/>
    <circle cx="45" cy="115" r="2"/>
    <circle cx="105" cy="115" r="2"/>
  </g>
  
  <!-- Connecting lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.3">
    <line x1="45" y1="35" x2="75" y2="55"/>
    <line x1="105" y1="35" x2="75" y2="55"/>
    <line x1="35" y1="45" x2="75" y2="55"/>
    <line x1="115" y1="45" x2="75" y2="55"/>
    <line x1="35" y1="105" x2="75" y2="100"/>
    <line x1="115" y1="105" x2="75" y2="100"/>
    <line x1="45" y1="115" x2="75" y2="100"/>
    <line x1="105" y1="115" x2="75" y2="100"/>
  </g>
</svg>